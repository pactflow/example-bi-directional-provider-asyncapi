name: Build

on:
  push:
  workflow_dispatch:

env:
  PACT_BROKER_BASE_URL: ${{ secrets.PACT_BROKER_BASE_URL }}
  PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
  GIT_COMMIT: ${{ github.sha }}
  GITHUB_REF: ${{ github.ref }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm ci

      # Drift is installed from npm (@pactflow/drift); log in with the same
      # PactFlow credentials used for publishing.
      - name: Log in to Drift
        run: npx drift auth login

      # Consumer tests → publish pact → start Kafka → verify the provider with
      # Drift → publish the AsyncAPI document with the Drift results
      - name: Test and publish
        run: GIT_BRANCH=${GITHUB_REF:11} make test_and_publish

      - name: Store Drift output
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: drift-output
          path: output/
          retention-days: 30

      - name: Stop Kafka
        if: always()
        run: make kafka_down

  can-i-deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm ci
      - run: GIT_BRANCH=${GITHUB_REF:11} make can_i_deploy

  deploy:
    runs-on: ubuntu-latest
    needs: can-i-deploy
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm ci
      - run: GIT_BRANCH=${GITHUB_REF:11} make deploy
        if: github.ref == 'refs/heads/main'
