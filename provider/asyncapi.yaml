asyncapi: 3.1.0
info:
  title: User Service
  version: "1.0.0"
  description: |
    Publishes user lifecycle events and supports synchronous user lookups
    via a request/reply pattern.
defaultContentType: application/json

# ---------------------------------------------------------------------------
# Servers — the local broker started by `make kafka_up` (compose.yaml).
# Drift uses this as its default connection.
# ---------------------------------------------------------------------------
servers:
  local:
    host: localhost:9092
    protocol: kafka
    description: Local Kafka broker started from compose.yaml

# ---------------------------------------------------------------------------
# Channels — the logical topics / queues the service uses
# ---------------------------------------------------------------------------
channels:
  userEvents:
    address: user-events
    description: Channel for user lifecycle events published by the service.
    messages:
      userCreated:
        summary: Emitted when a new user account is created.
        payload:
          type: object
          properties:
            userId:
              type: string
              description: Unique identifier for the user.
            email:
              type: string
              format: email
              description: Email address of the new user.
            name:
              type: string
              description: Display name of the user (optional at creation).
          required:
            - userId
            - email

      userDeleted:
        summary: Emitted when a user account is permanently deleted.
        payload:
          type: object
          properties:
            userId:
              type: string
              description: Unique identifier of the deleted user.
          required:
            - userId

  # The same userCreated event, encoded with Avro and with Protobuf. Each schema
  # is embedded in the document: PactFlow doesn't follow external references or
  # query schema registries.
  userEventsAvro:
    address: user-events-avro
    description: Channel for user lifecycle events, encoded with Avro.
    messages:
      userCreatedAvro:
        summary: Emitted when a new user account is created (Avro).
        contentType: avro/binary
        payload:
          schemaFormat: application/vnd.apache.avro;version=1.9.0
          schema:
            type: record
            name: UserCreated
            namespace: com.example.users
            doc: Emitted when a new user account is created.
            fields:
              - name: userId
                type: string
                doc: Unique identifier for the user.
              - name: email
                type: string
                doc: Email address of the new user.
              - name: name
                type: ["null", "string"]
                default: null
                doc: Display name of the user (optional at creation).

  userEventsProtobuf:
    address: user-events-protobuf
    description: Channel for user lifecycle events, encoded with Protobuf.
    messages:
      userCreatedProtobuf:
        summary: Emitted when a new user account is created (Protobuf).
        contentType: application/protobuf
        payload:
          schemaFormat: application/vnd.google.protobuf;version=3
          # The message key (userCreatedProtobuf) isn't a message in the schema,
          # so name the message to use explicitly
          x-drift-proto-message: users.UserCreated
          schema: |
            syntax = "proto3";

            package users;

            // Emitted when a new user account is created.
            message UserCreated {
              // Unique identifier for the user.
              string user_id = 1;
              // Email address of the new user.
              string email = 2;
              // Display name of the user (optional at creation).
              optional string name = 3;
            }

  getUserRequests:
    address: user-get-requests
    description: Inbound channel for synchronous user lookup requests.
    messages:
      getUserRequest:
        summary: Request to retrieve a user's details by ID.
        correlationId:
          location: "$message.header#/correlation-id"
          description: Copied onto the reply so the requester can match it.
        payload:
          type: object
          properties:
            userId:
              type: string
              description: ID of the user to look up.
          required:
            - userId

  getUserResponses:
    address: user-get-responses
    description: Outbound channel for user lookup replies.
    messages:
      getUserResponse:
        summary: Response containing the requested user's details.
        correlationId:
          location: "$message.header#/correlation-id"
          description: The correlation id of the request being answered.
        payload:
          type: object
          properties:
            userId:
              type: string
            name:
              type: string
            email:
              type: string
              format: email
          required:
            - userId
            - name
            - email

# ---------------------------------------------------------------------------
# Operations — how the service acts on each channel
# ---------------------------------------------------------------------------
operations:
  # Fire-and-forget: the service publishes events; consumers receive them.
  receiveUserEvents:
    action: receive
    channel:
      $ref: "#/channels/userEvents"
    messages:
      - $ref: "#/channels/userEvents/messages/userCreated"
      - $ref: "#/channels/userEvents/messages/userDeleted"

  # Fire-and-forget with an Avro payload.
  receiveUserEventsAvro:
    action: receive
    channel:
      $ref: "#/channels/userEventsAvro"
    messages:
      - $ref: "#/channels/userEventsAvro/messages/userCreatedAvro"

  # Fire-and-forget with a Protobuf payload.
  receiveUserEventsProtobuf:
    action: receive
    channel:
      $ref: "#/channels/userEventsProtobuf"
    messages:
      - $ref: "#/channels/userEventsProtobuf/messages/userCreatedProtobuf"

  # Request/Reply: the consumer sends a request; the service replies.
  # AsyncAPI 3.x models this as a "send" operation with a "reply" block.
  getUser:
    action: send
    channel:
      $ref: "#/channels/getUserRequests"
    messages:
      - $ref: "#/channels/getUserRequests/messages/getUserRequest"
    reply:
      channel:
        $ref: "#/channels/getUserResponses"
      messages:
        - $ref: "#/channels/getUserResponses/messages/getUserResponse"
